<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja | ABT Marketplace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>if(localStorage.getItem('abt_theme')==='dark')document.documentElement.classList.add('abt-tema-escuro');</script><link rel="stylesheet" href="tema.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f9f9f9 url('golden.jpg') repeat; background-size: 700px; margin: 0; color: #000000; }
        header { background: #ffffff; padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 3px solid #c5a059; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        header h1 { color: #000000; margin: 0; font-size: 1.4rem; cursor: pointer; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .filtros-wrapper { padding: 20px 5%; }
        .filtros-box { background: #ffffff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .btn-filtro { border: none; background: transparent; cursor: pointer; transition: 0.3s; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: #000000; letter-spacing: 0.5px; border-bottom: 2px solid transparent; }
        .btn-filtro:hover, .btn-filtro.active { color: #c5a059; border-bottom: 2px solid #c5a059; }
        .vitrine { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 25px; padding: 20px 5% 30px 5%; }
        .produto-card { background: #ffffff; padding: 15px; border-radius: 4px; box-shadow: 0 8px 25px rgba(0,0,0,0.06); text-align: center; display: flex; flex-direction: column; position: relative; transition: 0.3s; width:100%; max-width:280px; justify-self:center; }
        .produto-card::before { content: ''; position: absolute; top: 0; left: 0; width: 24px; height: 24px; border-top: 5px solid #000000; border-left: 5px solid #000000; }
        .produto-card img { width: 100%; height: 220px; object-fit: cover; border-radius: 4px; margin-bottom: 12px; }
        .badge-promo { position: absolute; top: 15px; right: 15px; background: #d93838; color: white; padding: 4px 10px; border-radius: 4px; font-size: 0.7rem; font-weight: 800; z-index: 10; }
        .btn-detalhe { background: transparent; border: 1px solid #c5a059; color: #c5a059; padding: 5px 15px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; border-radius: 4px; cursor: pointer; margin: 8px 0; transition: 0.3s; }
        .btn-detalhe:hover { background: #c5a059; color: #fff; }
        .preco-novo { color: #000; font-weight: 800; font-size: 1.1rem; display: block; margin: 5px 0; }
        .btn-comprar { background: #000000; color: #c5a059; border: none; width: 100%; padding: 12px; border-radius: 4px; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-top: auto; }
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background: #fff; padding: 20px; border-radius: 8px; width: 300px; }
        .esgotado { filter: grayscale(1); opacity: 0.7; }
        .esgotado-label { position: absolute; top: 40%; left: 0; width: 100%; color: red; font-weight: 800; font-size: 1.2rem; text-transform: uppercase; transform: rotate(-10deg); z-index: 11; text-shadow: 1px 1px 2px #000; }
        .search-box { padding: 0 5% 20px 5%; text-align: center; }
        .search-input { padding: 10px; width: 80%; max-width: 400px; border: 1px solid #c5a059; border-radius: 4px; }
        .btn-add-carrinho { background: #c5a059; color: #000; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-bottom: 10px; font-weight: 600; }
        @media (max-width: 720px) {
            header { padding:14px 16px; } header h1 { font-size:1rem; } header nav { gap:15px !important; }
            .filtros-wrapper { padding:14px 12px; } .filtros-box { justify-content:flex-start; flex-wrap:nowrap; overflow-x:auto; gap:16px; padding:12px; -webkit-overflow-scrolling:touch; }
            .filtros-box span { display:none; } .btn-filtro { flex:0 0 auto; font-size:.72rem; white-space:nowrap; }
            .search-box { padding:0 12px 14px; } .search-input { width:100%; max-width:none; font-size:.86rem; }
            .vitrine { grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; padding:12px 12px 28px; }
            .produto-card { padding:10px; min-width:0; } .produto-card img { height:auto; aspect-ratio:1/1; margin-bottom:8px; }
            .produto-card h3 { font-size:.8rem !important; min-height:38px; overflow:hidden; } .preco-novo { font-size:.9rem; } .btn-detalhe,.btn-add-carrinho,.btn-comprar { font-size:.63rem; padding:9px 6px; }
            .badge-promo { top:9px; right:9px; font-size:.6rem; padding:3px 6px; }
        }
        @media (max-width: 360px) { .vitrine { grid-template-columns:1fr; } .produto-card { max-width:290px; width:100%; margin:auto; } }
    </style>
</head>
<body>
<header>
    <h1 onclick="window.location.href='home.html'">ABT MARKETPLACE</h1>
    <nav style="display: flex; gap: 20px; align-items: center;"><a href="home.html"><i class="fas fa-home"></i></a><a href="outfit.html" title="Consultor IA"><i class="fas fa-robot"></i></a><a href="carrinho.html" style="position: relative;"><i class="fas fa-shopping-cart"></i><span id="cart-counter" style="background:#000; color:#c5a059; font-size:0.7rem; padding:2px 6px; border-radius:50%; position:absolute; top:-7px; right:-12px;">0</span></a></nav>
</header>
<div class="filtros-wrapper">
    <div class="filtros-box">
        <button class="btn-filtro active" onclick="filtrar('todos', this)">Todos</button>
        <button class="btn-filtro" onclick="filtrar('Masculino', this)">Masculino</button>
        <button class="btn-filtro" onclick="filtrar('Feminino', this)">Feminino</button>
        <button class="btn-filtro" onclick="filtrar('Criança', this)">Criança</button>
        <button class="btn-filtro" onclick="filtrar('Acessórios', this)">Acessórios</button>
        <button class="btn-filtro" onclick="filtrar('Cosmético', this)">Cosmético</button>
        <button class="btn-filtro" onclick="filtrar('Eletrónico', this)">Tecnologia</button>
        <button class="btn-filtro" onclick="filtrar('Outros', this)">Outros</button>
        <span style="border-left: 1px solid #ddd; margin: 0 10px;"></span>
        <button class="btn-filtro" onclick="document.getElementById('modalTam').style.display='flex'">Tamanhos</button>
        <button class="btn-filtro" onclick="filtrarOri('todos', this)">Ambos</button>
        <button class="btn-filtro" onclick="filtrarOri('ABT', this)">Própria</button>
        <button class="btn-filtro" onclick="filtrarOri('Parceiro', this)">Parceiros</button>
    </div>
</div>
<div class="search-box">
    <input type="search" id="searchInput" class="search-input" placeholder="Pesquisar por produto, marca ou categoria..." autocomplete="off">
</div>
<div id="modalTam" class="modal" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3 style="margin-top:0;">Selecione o Tamanho</h3>
        <div id="listaTamanhos" style="display:flex; flex-direction:column; gap:10px;"></div>
    </div>
</div>
<div id="container-produtos" class="vitrine"></div>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    
    const db = getFirestore(initializeApp({apiKey: "AIzaSyDWTvMQNPc27WJpQfKr1zwdvaw1LDMUxH0", authDomain: "abt-marketplace.firebaseapp.com", projectId: "abt-marketplace", storageBucket: "abt-marketplace.firebasestorage.app", messagingSenderId: "763460800092", appId: "1:763460800092:web:5ac1f341919c1fa02ea099"}));
    
    let pD = 0, descontosLojas = {}, pCache = [], cA = 'todos', tA = 'todos', oA = 'todos';
    const atalho = new URLSearchParams(location.search).get('cat');
    if (atalho) cA = atalho === 'roupas' ? 'roupas' : atalho === 'calcados' ? 'calçado' : atalho === 'acessorios' ? 'acessório' : atalho;

   window.enviarWhatsApp = (nome, preco, marca, wppParceiro) => {
    const numeroABT = "244946560930";
    
    // FORÇAMOS A VERIFICAÇÃO:
    // Se for um produto da ABT, o wppParceiro deve ser ignorado.
    // Se a marca for "ABT" ou o campo wppParceiro estiver "estranho" (como esse 244900000000), ignoramos.
    
    const numeroDestino = (marca === "ABT" || wppParceiro === "244900000000" || !wppParceiro) 
                          ? numeroABT 
                          : wppParceiro;

    const msg = `Olá! Gostaria de encomendar: ${nome}. Preço: ${preco} Kz.`;
    window.open(`https://wa.me/${numeroDestino}?text=${encodeURIComponent(msg)}`, '_blank');
};

    async function init() { 
        try { const [d, lojas] = await Promise.all([getDoc(doc(db, "configuracoes", "home")), getDoc(doc(db, "configuracoes", "descontos_lojas"))]); if (d.exists()) pD = Number(d.data().desconto || 0); if (lojas.exists()) descontosLojas = lojas.data().lojas || {}; } catch(e) {} 
        onSnapshot(collection(db, "produtos"), (snap) => { pCache = []; snap.forEach(d => pCache.push({ id: d.id, ...d.data() })); render(); });
    }

    window.addC = (i, n, p, im, o, m, q, precoOriginal, promocao) => { if(q <= 0) return; let c = JSON.parse(localStorage.getItem('abt_carrinho')) || []; const pr = { id: i, nome: n, preco: p, precoOriginal: precoOriginal || p, promocao: promocao === true, imagem: im, qtd: 1, origem: o || 'ABT', marca: m || 'ABT' }; const idx = c.findIndex(x => x.id === i); if(idx > -1) c[idx].qtd++; else c.push(pr); localStorage.setItem('abt_carrinho', JSON.stringify(c)); updC(); alert("Adicionado!"); };
    
    function updC() { const c = JSON.parse(localStorage.getItem('abt_carrinho')) || []; document.getElementById('cart-counter').innerText = c.reduce((s, i) => s + i.qtd, 0); }
    window.filtrar = (c, b) => { if(b) { b.parentElement.querySelectorAll('.btn-filtro').forEach(x => x.classList.remove('active')); b.classList.add('active'); } cA = c; render(); };
    window.filtrarTam = (t) => { tA = t; render(); };
    window.filtrarOri = (o, b) => { if(b) { b.parentElement.querySelectorAll('.btn-filtro').forEach(x => x.classList.remove('active')); b.classList.add('active'); } oA = o; render(); };
    
    const normalizarTexto = (valor) => String(valor || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();

    function render() {
        const ct = document.getElementById('container-produtos'); ct.innerHTML = "";
        const termo = normalizarTexto(document.getElementById('searchInput').value);
        let tams = new Set(['todos']); let encontrou = false;
        pCache.forEach(p => {
            const pesquisaProduto = normalizarTexto([p.nome, p.marca, p.categoria, p.descricao].join(' '));
            const cat = normalizarTexto(p.categoria);
            const gen = normalizarTexto(p.genero);
            const filtro = normalizarTexto(cA);
            const est = parseInt(p.estoque || 0);
            const eRoupa = ['peca superior', 'peca inferior', 'peca unica'].includes(cat);
            let condCat = (filtro === 'todos' || (filtro === 'novidades' && p.novidade === true) || (filtro === 'roupas' && eRoupa) || cat.includes(filtro) || gen === filtro);
            const condTam = (tA === 'todos' || (p.tamanhos && p.tamanhos.includes(tA)));
            const condOri = (oA === 'todos' || (p.origem || 'ABT') === oA);
            const condBusca = !termo || pesquisaProduto.includes(termo);
            if (condCat && p.tamanhos) p.tamanhos.forEach(t => tams.add(t));
            
            if (condCat && condTam && condOri && condBusca) {
                encontrou = true;
                const nomeLoja = p.marca || p.loja || (p.origem === 'ABT' ? 'ABT' : 'ABT');
                const descontoProduto = Number(descontosLojas[nomeLoja] ?? pD);
                const valorFinal = p.promocao ? (parseFloat(p.preco) * (1 - (descontoProduto/100))) : parseFloat(p.preco);
                const isEsgotado = est <= 0;
                ct.innerHTML += `<div class="produto-card ${isEsgotado ? 'esgotado' : ''}">
                    ${isEsgotado ? '<div class="esgotado-label">ESGOTADO</div>' : ''}
                    ${p.promocao && descontoProduto > 0 && !isEsgotado ? `<div class="badge-promo">-${descontoProduto}%</div>` : ''}
                    <img src="${p.imagem}" onclick="window.location.href='produto.html?id=${p.id}'">
                    <span style="font-size:0.65rem; font-weight:700; color:#c5a059;">${p.origem === 'Parceiro' ? '<i class="fas fa-handshake"></i> ' + (p.marca || 'Parceiro') : '<i class="fas fa-gem"></i> Exclusivo ABT'}</span>
                    <h3 style="font-size:0.95rem; margin:8px 0; font-weight:600;">${p.nome}</h3>
                    <button class="btn-detalhe" onclick="window.location.href='produto.html?id=${p.id}'">Ver Detalhes</button>
                    <div style="margin:5px 0;"><span class="preco-novo">${Math.round(valorFinal).toLocaleString()} Kz</span></div>
                    <button class="btn-add-carrinho" onclick="addC('${p.id}', '${p.nome}', ${valorFinal}, '${p.imagem}', '${p.origem}', '${p.marca}', ${est}, ${parseFloat(p.preco)}, ${p.promocao === true})"><i class="fas fa-cart-plus"></i> Adicionar ao Carrinho</button>
                    <button class="btn-comprar" ${isEsgotado ? 'disabled style="background:#ccc; cursor:not-allowed;"' : ''} 
                        onclick="enviarWhatsApp('${p.nome}', ${Math.round(valorFinal)}, '${p.marca || 'ABT'}', '${p.whatsappParceiro || ''}')">
                        ${isEsgotado ? 'Indisponível' : 'Pedir via WhatsApp'}
                    </button>
                </div>`;
            }
        });
        const listaT = document.getElementById('listaTamanhos');
        listaT.innerHTML = `<button class="btn-filtro" onclick="filtrarTam('todos'); document.getElementById('modalTam').style.display='none'">Todos</button>`;
        Array.from(tams).sort().forEach(t => { listaT.innerHTML += `<button class="btn-filtro" onclick="filtrarTam('${t}'); document.getElementById('modalTam').style.display='none'">${t}</button>`; });
        if (!encontrou) ct.innerHTML = `<p style='width:100%; text-align:center;'>Nenhum produto encontrado${termo ? ` para “${document.getElementById('searchInput').value.trim()}”` : ' nesta seleção'}.</p>`;
    }
    document.getElementById('searchInput').addEventListener('input', render);
    updC(); init();
</script>
</body>
</html>
