<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | ABT Marketplace</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #f9f9f9 url('golden.jpg') repeat;
            background-size: 700px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.96);
            padding: 40px;
            border-radius: 4px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 350px;
            text-align: center;
            color: #000000;
            border-top: 4px solid #c5a059;
            position: relative;
        }
        .login-card::before { content: ''; position: absolute; top: -4px; left: 0; width: 20px; height: 20px; border-top: 5px solid #000000; border-left: 5px solid #000000; }
        .login-card h2 { margin-bottom: 5px; color: #000000; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .login-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            box-sizing: border-box;
            background: #ffffff;
            color: #000000;
            outline: none;
            font-family: 'Poppins';
        }
        .login-card button {
            width: 100%;
            padding: 14px;
            background: #000000;
            border: none;
            color: #c5a059;
            font-weight: 800;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .login-card button:hover { background: #1c1c1c; }
        .msg-erro { color: #d93838; font-size: 0.8rem; margin-bottom: 15px; display: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Painel ABT</h2>
    <p style="color: #666666; font-size: 0.85rem; margin-bottom: 25px; font-weight: 500;">Acesso restrito ao administrador</p>
    
    <div id="erro" class="msg-erro">Usuário ou senha incorretos!</div>
    
    <input type="text" id="usuario" placeholder="Utilizador">
    <input type="password" id="senha" placeholder="Palavra-passe">
    
    <button onclick="entrarNoPainel()">Entrar</button>
</div>

<script>
    function entrarNoPainel() {
        const user = document.getElementById("usuario").value;
        const pass = document.getElementById("senha").value;
        const msgErro = document.getElementById("erro");

        // CREDENCIAIS QUE DEFINIMOS ANTES
        if (user === "admin.00" && pass === "0430") {
            // CRIA A CHAVE DE ACESSO
            localStorage.setItem("adminLogado", "true");
            
            // REDIRECIONA PARA O ADMIN
            window.location.href = "admin.html";
        } else {
            // MOSTRA ERRO SE FALHAR
            msgErro.style.display = "block";
            setTimeout(() => { msgErro.style.display = "none"; }, 3000);
        }
    }

    // Permitir entrar ao carregar na tecla "Enter"
    document.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') entrarNoPainel();
    });
</script>

</body>
</html>
