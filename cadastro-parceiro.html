<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Parceiro | ABT Marketplace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f9f9f9 url('golden.jpg') repeat; background-size: 700px; margin: 0; color: #000000; }
        header { background: #ffffff; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #c5a059; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { margin: 0; font-size: 1.3rem; cursor:pointer; font-weight: 800; text-transform: uppercase; }
        .cadastro-container { max-width: 600px; margin: 40px auto; padding: 30px; background: rgba(255, 255, 255, 0.96); border-radius: 4px; box-shadow: 0 8px 25px rgba(0,0,0,0.06); border: 1px solid #e0e0e0; }
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }
        .form-group input, .form-group select, .form-group textarea { padding: 12px; border: 1px solid #e0e0e0; border-radius: 4px; outline: none; }
        .btn-cadastrar { background: #000000; color: #c5a059; border: none; width: 100%; padding: 16px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        #msg-status { text-align: center; margin-top: 15px; font-weight: 700; display: none; }
    </style>
</head>
<body>

<header>
    <h1 onclick="window.location.href='home.html'">ABT MARKETPLACE</h1>
    <a href="home.html" style="color: #000; text-decoration: none; font-weight: 600;">Voltar</a>
</header>

<main class="cadastro-container">
    <h2>Seja um Parceiro</h2>
    <form id="form-cadastro-empresa">
        <div class="form-group">
            <label>Nome da Empresa / Marca</label>
            <input type="text" id="nomeEmpresa" required>
        </div>
        <div class="form-group">
            <label>NIF</label>
            <input type="text" id="nif" required>
        </div>
        <div class="form-group">
            <label>Nome do Responsável</label>
            <input type="text" id="responsavel" required>
        </div>
        <div class="form-group">
            <label>WhatsApp</label>
            <input type="tel" id="whatsapp" required placeholder="2449XXXXXXXXX">
        </div>
        <div class="form-group">
            <label>E-mail Corporativo</label>
            <input type="email" id="email" required>
        </div>
        <div class="form-group">
            <label>Palavra-passe</label>
            <input type="password" id="senha" required>
        </div>
        <div class="form-group">
            <label>Segmento Principal</label>
            <select id="categoria" required>
                <option value="Eletrónica">Eletrónica e Tecnologia</option>
                <option value="Outros">Outros</option>
                <option value="Vestuário">Vestuário</option>
                <option value="Calçados">Calçados</option>
                <option value="Acessórios">Acessórios</option>
            </select>
        </div>
        <button type="submit" class="btn-cadastrar">Enviar Cadastro 🚀</button>
        <p id="msg-status"></p>
    </form>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const app = initializeApp({ apiKey: "AIzaSyDWTvMQNPc27WJpQfKr1zwdvaw1LDMUxH0", authDomain: "abt-marketplace.firebaseapp.com", projectId: "abt-marketplace", storageBucket: "abt-marketplace.firebasestorage.app", messagingSenderId: "763460800092", appId: "1:763460800092:web:5ac1f341919c1fa02ea099" });
    const db = getFirestore(app);
    const auth = getAuth(app);

    document.getElementById("form-cadastro-empresa").addEventListener("submit", async (e) => {
        e.preventDefault();
        const msgStatus = document.getElementById("msg-status");
        msgStatus.style.display = "block";
        msgStatus.innerText = "A enviar...";

        try {
            const email = document.getElementById("email").value.trim().toLowerCase();
            const senha = document.getElementById("senha").value;
            const credencial = await createUserWithEmailAndPassword(auth, email, senha);
            await setDoc(doc(db, "empresas", credencial.user.uid), {
                nomeEmpresa: document.getElementById("nomeEmpresa").value.trim(),
                nif: document.getElementById("nif").value.trim(),
                responsavel: document.getElementById("responsavel").value.trim(),
                whatsapp: document.getElementById("whatsapp").value.trim(),
                email,
                categoria: document.getElementById("categoria").value,
                status: "pendente",
                dataCadastro: new Date().toISOString()
            });
            msgStatus.innerText = "✅ Cadastro enviado com sucesso!";
            await signOut(auth);
            document.getElementById("form-cadastro-empresa").reset();
        } catch (error) {
            console.error(error);
            msgStatus.innerText = "❌ Erro ao enviar.";
        }
    });
</script>
</body>
</html>
