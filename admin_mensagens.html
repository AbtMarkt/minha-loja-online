<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mensagens | ABT Admin</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#c5a059;--ink:#111;--line:#e8e8e8;--muted:#777}*{box-sizing:border-box;font-family:Poppins,sans-serif}body{margin:0;background:#f3f4f5;color:var(--ink)}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(100%,390px);padding:28px;background:#fff;border-radius:14px;border-top:5px solid var(--gold);box-shadow:0 15px 35px #00000014}.login-card h1{font-size:1.25rem;margin:0 0 8px}.login-card p{color:var(--muted);font-size:.84rem}.login-card input{width:100%;padding:11px;margin:7px 0;border:1px solid var(--line);border-radius:7px}.btn{border:0;background:#111;color:var(--gold);font-weight:800;padding:11px 14px;border-radius:7px;cursor:pointer}.btn.full{width:100%;margin-top:12px}.hidden{display:none!important}.app{height:100vh;display:grid;grid-template-columns:335px minmax(0,1fr);background:#fff}.sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.sidebar-head{padding:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:.5px}.brand b{color:var(--gold)}.sidebar-head a{font-size:.75rem;color:#745817;font-weight:700;text-decoration:none}.search{margin:12px;padding:10px 12px;border:1px solid var(--line);border-radius:7px}.conversation-list{overflow:auto;flex:1}.conversation{width:100%;border:0;border-bottom:1px solid #f1f1f1;background:#fff;padding:14px;text-align:left;display:flex;gap:11px;cursor:pointer}.conversation:hover,.conversation.active{background:#fcfaf5}.avatar{width:42px;height:42px;display:grid;place-items:center;flex:none;border-radius:50%;background:#111;color:var(--gold);font-weight:800}.conversation-info{min-width:0;flex:1}.conversation-info strong,.conversation-info small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.conversation-info strong{font-size:.83rem}.conversation-info small{font-size:.7rem;color:var(--muted);margin-top:3px}.time{font-size:.63rem;color:#999;white-space:nowrap}.chat{display:flex;flex-direction:column;min-width:0;background:#efe9dc url('golden.jpg') repeat;background-size:700px}.chat-head{height:75px;padding:0 22px;background:#fff;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.chat-head h2{font-size:.94rem;margin:0}.chat-head p{font-size:.7rem;margin:2px 0;color:var(--muted)}.chat-body{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:10px}.empty-chat{margin:auto;background:#fff;padding:16px;border-radius:9px;color:#666;font-size:.84rem}.bubble{max-width:min(78%,560px);padding:10px 12px;border-radius:8px;font-size:.82rem;line-height:1.5;box-shadow:0 1px 2px #00000010}.bubble.client{align-self:flex-start;background:#fff;border-top-left-radius:0}.bubble.admin{align-self:flex-end;background:#f3d684;border-top-right-radius:0}.bubble small{display:block;text-align:right;font-size:.62rem;color:#6f5a21;margin-top:4px}.composer{padding:12px 18px;background:#fff;display:flex;gap:9px;align-items:flex-end}.composer textarea{flex:1;resize:none;min-height:42px;max-height:110px;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:.84rem}.send{width:43px;height:43px;border-radius:50%;border:0;background:var(--gold);color:#111;cursor:pointer;font-size:1rem}.status{font-size:.76rem;min-height:18px;color:#b42318}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{height:100vh}.chat{position:fixed;inset:0;z-index:5}.chat.hidden{display:none}.back-mobile{display:inline-grid!important}.chat-body{padding:14px}.bubble{max-width:88%}.composer{padding:10px}.sidebar-head{padding:16px}}@media(min-width:761px){.back-mobile{display:none!important}}
</style></head><body>
<section id="login" class="login"><div class="login-card"><h1>Mensagens ABT</h1><p>Acesso exclusivo da equipa administradora.</p><input id="email" type="email" placeholder="E-mail de administrador" autocomplete="email"><input id="password" type="password" placeholder="Palavra-passe" autocomplete="current-password"><button id="login-button" class="btn full">Entrar</button><p id="login-status" class="status"></p><a href="home.html" style="font-size:.78rem;color:#666">← Voltar à loja</a></div></section>
<main id="app" class="app hidden"><aside class="sidebar"><div class="sidebar-head"><span class="brand">ABT <b>MENSAGENS</b></span><a href="admin.html">Gestão</a></div><input id="search" class="search" placeholder="Pesquisar conversa"><div id="conversation-list" class="conversation-list"></div></aside><section id="chat" class="chat hidden"><header class="chat-head"><button id="back" class="back-mobile btn" style="padding:7px 9px">←</button><div class="avatar" id="chat-avatar">A</div><div><h2 id="chat-name">Selecione uma conversa</h2><p id="chat-detail">Mensagens em tempo real</p></div></header><div id="chat-body" class="chat-body"><p class="empty-chat">Escolha uma conversa à esquerda para responder.</p></div><form id="composer" class="composer"><textarea id="reply" placeholder="Escreva uma resposta…" required></textarea><button class="send" title="Enviar" aria-label="Enviar mensagem"><i class="fas fa-paper-plane"></i></button></form></section></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';import{getFirestore,collection,doc,getDoc,query,orderBy,onSnapshot,addDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyDWTvMQNPc27WJpQfKr1zwdvaw1LDMUxH0',authDomain:'abt-marketplace.firebaseapp.com',projectId:'abt-marketplace',storageBucket:'abt-marketplace.firebasestorage.app',messagingSenderId:'763460800092',appId:'1:763460800092:web:5ac1f341919c1fa02ea099'}),auth=getAuth(app),db=getFirestore(app);const $=id=>document.getElementById(id),safe=v=>String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let mensagens=[],selecionada=null,pararRespostas=null;
const date=v=>v?.toDate?v.toDate().toLocaleString('pt-PT'):'Agora';function nome(m){return m.de==='Parceiro'?(m.nomeEmpresa||'Parceiro ABT'):(m.nome||'Cliente ABT')}function renderList(){const term=$('search').value.toLowerCase();const items=mensagens.filter(m=>`${nome(m)} ${m.msg||''}`.toLowerCase().includes(term));$('conversation-list').innerHTML=items.length?items.map(m=>`<button class="conversation ${m.id===selecionada?.id?'active':''}" data-id="${m.id}"><span class="avatar">${safe(nome(m).charAt(0))}</span><span class="conversation-info"><strong>${safe(nome(m))}</strong><small>${safe(m.msg||'Sem mensagem')}</small></span><span class="time">${date(m.data)}</span></button>`).join(''):'<p style="padding:15px;color:#777;font-size:.82rem">Não há conversas.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>abrir(b.dataset.id))}function renderChat(base,respostas=[]){const linhas=[{msg:base.msg,data:base.data,de:'cliente'},...respostas].sort((a,b)=>(a.data?.toMillis?.()||0)-(b.data?.toMillis?.()||0));$('chat-body').innerHTML=linhas.map(l=>`<div class="bubble ${l.de==='Admin'?'admin':'client'}">${safe(l.msg)}<small>${date(l.data)}</small></div>`).join('');$('chat-body').scrollTop=$('chat-body').scrollHeight}function abrir(id){selecionada=mensagens.find(m=>m.id===id);if(!selecionada)return;renderList();$('chat').classList.remove('hidden');$('chat-name').textContent=nome(selecionada);$('chat-detail').textContent=selecionada.de==='Parceiro'?'Parceiro ABT':'Cliente / visitante';$('chat-avatar').textContent=nome(selecionada).charAt(0).toUpperCase();if(pararRespostas)pararRespostas();pararRespostas=onSnapshot(query(collection(db,'mensagens',id,'respostas'),orderBy('data','asc')),s=>renderChat(selecionada,s.docs.map(d=>d.data())))}
$('search').oninput=renderList;$('back').onclick=()=>$('chat').classList.add('hidden');$('composer').onsubmit=async e=>{e.preventDefault();if(!selecionada)return;const msg=$('reply').value.trim();if(!msg)return;await addDoc(collection(db,'mensagens',selecionada.id,'respostas'),{msg,de:'Admin',data:serverTimestamp()});$('reply').value=''};$('login-button').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch{$('login-status').textContent='E-mail ou palavra-passe inválidos.'}};onAuthStateChanged(auth,async u=>{if(!u)return;const a=await getDoc(doc(db,'admins',u.uid));if(!a.exists()||a.data().ativo!==true){await signOut(auth);$('login-status').textContent='Esta conta não tem autorização.';return}$('login').classList.add('hidden');$('app').classList.remove('hidden');onSnapshot(query(collection(db,'mensagens'),orderBy('data','desc')),s=>{mensagens=s.docs.map(d=>({id:d.id,...d.data()}));renderList();if(selecionada)selecionada=mensagens.find(m=>m.id===selecionada.id)||null})});
</script></body></html>
