<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depoimentos Reais | ABT Marketplace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f9f9f9 url('golden.jpg') repeat; background-size: 700px; margin: 0; color: #000000; }
        header { background: #ffffff; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #c5a059; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        header h1 { color: #000000; margin: 0; font-size: 1.3rem; cursor:pointer; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        
        .depo-container { max-width: 750px; margin: 40px auto; padding: 30px; background: rgba(255, 255, 255, 0.96); border-radius: 4px; box-shadow: 0 8px 25px rgba(0,0,0,0.06); position: relative; border: 1px solid #e0e0e0; }
        .depo-container::before { content: ''; position: absolute; top: 0; left: 0; width: 24px; height: 24px; border-top: 5px solid #000000; border-left: 5px solid #000000; }
        
        h2 { font-size: 1.8rem; color: #000000; margin: 0 0 10px 0; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; text-align: center; }
        p.subtitle { text-align: center; color: #666666; font-size: 0.9rem; margin-bottom: 30px; font-weight: 500; }
        
        .grid-depoimentos { display: flex; flex-direction: column; gap: 20px; margin-bottom: 40px; }
        .card-depo { background: #ffffff; padding: 20px; border-radius: 4px; border-left: 4px solid #c5a059; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .card-depo p { font-style: italic; color: #444444; font-size: 0.95rem; margin: 0 0 10px 0; line-height: 1.6; }
        .autor-depo { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 700; color: #000000; text-transform: uppercase; }
        .estrelas-view { color: #c5a059; letter-spacing: 2px; }

        .form-depo { background: #ffffff; padding: 25px; border: 1px solid #e0e0e0; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .form-depo h3 { margin: 0 0 15px 0; font-size: 1.1rem; font-weight: 800; text-transform: uppercase; text-align: center; }
        
        /* SISTEMA DE ESTRELAS INTERATIVAS */
        .rating-stars { display: flex; justify-content: center; gap: 10px; margin: 10px 0 20px 0; flex-direction: row-reverse; }
        .rating-stars i { font-size: 1.8rem; color: #e0e0e0; cursor: pointer; transition: 0.3s; }
        .rating-stars i:hover, .rating-stars i:hover ~ i, .rating-stars i.active, .rating-stars i.active ~ i { color: #c5a059; }

        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .form-group input, .form-group select, .form-group textarea { padding: 12px; border: 1px solid #e0e0e0; border-radius: 4px; font-size: 0.95rem; font-family: 'Poppins'; outline: none; background: #ffffff; }
        .form-group input:focus, .form-group textarea:focus { border-color: #c5a059; }
        
        .btn-enviar { background: #000000; color: #c5a059; border: none; width: 100%; padding: 16px; border-radius: 4px; font-weight: 800; cursor: pointer; transition: 0.3s; letter-spacing: 0.5px; text-transform: uppercase; border: 1px solid #000000; }
        .btn-enviar:hover { background: #c5a059; color: #000000; border-color: #c5a059; }
        #status-msg { text-align: center; margin-top: 15px; font-weight: 700; font-size: 0.9rem; display: none; }
        
        a.voltar-link { display: block; text-align: center; margin-top: 25px; text-decoration: none; color: #000000; font-size: 0.85rem; font-weight: 700; border-bottom: 2px solid #c5a059; width: max-content; margin-left: auto; margin-right: auto; }
    </style>
</head>
<body>

<header>
    <h1 onclick="window.location.href='home.html'">ABT MARKETPLACE</h1>
    <a href="home.html" style="color: #000000; text-decoration: none; font-size: 0.9rem; font-weight: 600;"><i class="fas fa-arrow-left"></i> Voltar</a>
</header>

<main class="depo-container">
    <h2>A voz dos nossos clientes</h2>
    <p class="subtitle">Depoimentos 100% reais de quem compra e vende no nosso ecossistema.</p>
    
    <div class="grid-depoimentos" id="container-depoimentos">
        <p style="text-align: center; padding: 20px; color: #666;">A carregar feedbacks autênticos...</p>
    </div>

    <div class="form-depo">
        <h3>Deixe o seu Testemunho Real</h3>
        
        <div class="rating-stars" id="star-rating">
            <i class="fas fa-star" data-value="5"></i>
            <i class="fas fa-star" data-value="4"></i>
            <i class="fas fa-star" data-value="3"></i>
            <i class="fas fa-star" data-value="2"></i>
            <i class="fas fa-star" data-value="1"></i>
        </div>

        <form id="form-add-depoimento">
            <input type="hidden" id="valorEstrelas" value="5"> <div class="form-group">
                <label for="nomeCliente">Seu Nome Completo</label>
                <input type="text" id="nomeCliente" required placeholder="Ex: Hamilton Silva">
            </div>
            
            <div class="form-group">
                <label for="tipoPerfil">Você é:</label>
                <select id="tipoPerfil" required>
                    <option value="Cliente">Comprador / Cliente</option>
                    <option value="Parceiro">Vendedor / Parceiro da Marca</option>
                </select>
            </div>

            <div class="form-group">
                <label for="textoDepoimento">Seu Relato Sincero</label>
                <textarea id="textoDepoimento" rows="3" required placeholder="Conte a sua experiência real..."></textarea>
            </div>

            <button type="submit" class="btn-enviar">Publicar Testemunho Oficial 🚀</button>
            <p id="status-msg"></p>
        </form>
    </div>
    
    <a href="home.html" class="voltar-link">← Voltar para a Home</a>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDWTvMQNPc27WJpQfKr1zwdvaw1LDMUxH0",
        authDomain: "abt-marketplace.firebaseapp.com",
        projectId: "abt-marketplace",
        storageBucket: "abt-marketplace.firebasestorage.app",
        messagingSenderId: "763460800092",
        appId: "1:763460800092:web:5ac1f341919c1fa02ea099"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const estrelas = document.querySelectorAll('#star-rating i');
    const inputEstrelas = document.getElementById('valorEstrelas');

    estrelas.forEach(star => {
        star.addEventListener('click', () => {
            const val = star.getAttribute('data-value');
            inputEstrelas.value = val;
            estrelas.forEach(s => s.classList.remove('active'));
            star.classList.add('active');
        });
    });

    // Esta função agora escuta TUDO e atualiza instantaneamente
    function carregarDepoimentos() {
        const container = document.getElementById("container-depoimentos");
        const q = query(collection(db, "depoimentos"), orderBy("data", "desc"));
        
        onSnapshot(q, (snapshot) => {
            container.innerHTML = "";
            if (snapshot.empty) {
                container.innerHTML = "<p style='text-align: center; color: #666; padding: 20px;'>Seja o primeiro a deixar um testemunho real abaixo! ✨</p>";
                return;
            }

            snapshot.forEach(doc => {
                const dados = doc.data();
                let estrelasHTML = "";
                for(let i=0; i<5; i++) {
                    estrelasHTML += i < dados.estrelas ? '<i class="fas fa-star"></i>' : '<i class="far fa-star"></i>';
                }
                
                container.innerHTML += `
                    <div class="card-depo">
                        <p>"${dados.texto}"</p>
                        <div class="autor-depo">
                            <span>${dados.nome} (${dados.perfil})</span>
                            <span class="estrelas-view">${estrelasHTML}</span>
                        </div>
                    </div>
                `;
            });
        });
    }

    document.getElementById("form-add-depoimento").addEventListener("submit", async (e) => {
        e.preventDefault();
        const msg = document.getElementById("status-msg");
        msg.style.display = "block";
        msg.innerText = "A publicar...";

        try {
            await addDoc(collection(db, "depoimentos"), {
                nome: document.getElementById("nomeCliente").value.trim(),
                perfil: document.getElementById("tipoPerfil").value,
                estrelas: Number(inputEstrelas.value),
                texto: document.getElementById("textoDepoimento").value.trim(),
                data: new Date().toISOString()
            });
            msg.style.color = "#27ae60";
            msg.innerText = "✅ Testemunho publicado com sucesso!";
            document.getElementById("form-add-depoimento").reset();
            estrelas.forEach(s => s.classList.remove('active'));
            setTimeout(() => { msg.style.display = "none"; }, 3000);
        } catch (error) {
            msg.style.color = "#d93838";
            msg.innerText = "❌ Erro ao publicar.";
        }
    });

    carregarDepoimentos();
</script>
</body>
</html>
